name: auto-sheet-music
dependencies:
  - pip
  - pyqt>=6.6
  - pyqtgraph
  - python=3.13
  - numpy>=1.26
  - scipy
  - pip:
    - librosa>=0.11.0
    - music21>=9.1
    - sounddevice>=0.4.6
    - soxr>=0.3
    - torch
    - torchcrepe
    - onnxruntime>=1.17
    - pretty-midi>=0.2.9
    - mir-eval>=0.6
    - mido>=1.3
    - importlib_resources>=5.0
    - soundfile>=0.12
    # basic-pitch itself installed via scripts/install_basic_pitch.sh
    # after `conda env create` because of the TF base-dep workaround.